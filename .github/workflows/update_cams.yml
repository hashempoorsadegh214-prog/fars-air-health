name: Update CAMS Air Quality

on:
  workflow_dispatch:
    inputs:
      request_date:
        description: "CAMS forecast initialization date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-cams:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and process CAMS data
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
          REQUEST_DATE: ${{ inputs.request_date }}
        run: |
          if [ -n "$REQUEST_DATE" ]; then
            python scripts/process_cams.py --date "$REQUEST_DATE"
          else
            python scripts/process_cams.py
          fi

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update CAMS air quality data"
            git push
          else
            echo "No changes to commit."
          fi
